name: contractlens

services:
  postgres:
    image: pgvector/pgvector:pg16
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-contractlens}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-contractlens}
      POSTGRES_DB: ${POSTGRES_DB:-contractlens}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Only used on first empty volume (fresh DB). Existing pgdata is left untouched.
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  neo4j:
    image: neo4j:5
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-contractlens}
      NEO4J_PLUGINS: '[]'
    ports:
      - "${NEO4J_BOLT_PORT:-7688}:7687"
    volumes:
      - neo4jdata:/data
    healthcheck:
      # Browser port is internal-only (not published); used just for readiness.
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 40s
    restart: unless-stopped
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-contractlens}:${POSTGRES_PASSWORD:-contractlens}@postgres:5432/${POSTGRES_DB:-contractlens}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-contractlens}
      UPLOAD_DIR: /app/data/uploads
      HF_HOME: /cache/huggingface
      HUGGINGFACE_HUB_CACHE: /cache/huggingface/hub
      HF_HUB_CACHE: /cache/huggingface/hub
      TRANSFORMERS_CACHE: /cache/huggingface
      # Optional: higher HF rate limits / more reliable downloads
      HF_TOKEN: ${HF_TOKEN:-}
      # Optional: LangSmith tracing (leave LANGCHAIN_API_KEY empty to disable)
      LANGCHAIN_TRACING_V2: ${LANGCHAIN_TRACING_V2:-false}
      LANGCHAIN_API_KEY: ${LANGCHAIN_API_KEY:-}
      LANGCHAIN_PROJECT: ${LANGCHAIN_PROJECT:-contractlens}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      # Set DEV_RELOAD=1 only if Docker Desktop has plenty of RAM (8GB+).
      DEV_RELOAD: ${DEV_RELOAD:-0}
    ports:
      - "${API_PORT:-8010}:8000"
    volumes:
      - ./app:/app/app
      - ./schema.sql:/app/schema.sql:ro
      - ./schema.cypher:/app/schema.cypher:ro
      - ./scripts:/app/scripts
      - uploads:/app/data/uploads
      - hf_cache:/cache/huggingface
    # Reload doubles process memory; default off to avoid watchfiles OOM with bge-m3.
    command:
      - sh
      - -c
      - |
        if [ "$$DEV_RELOAD" = "1" ]; then
          exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /app/app
        else
          exec uvicorn app.main:app --host 0.0.0.0 --port 8000
        fi
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 30s
      timeout: 5s
      retries: 3
      # bge-m3 warmup at startup takes ~40s; do not flag the API before that.
      start_period: 180s
    restart: unless-stopped
    logging:
      options:
        max-size: "20m"
        max-file: "3"


  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8010}
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/index.html:/app/index.html
      - ./frontend/vite.config.js:/app/vite.config.js
      - ./frontend/tailwind.config.js:/app/tailwind.config.js
      - ./frontend/postcss.config.js:/app/postcss.config.js
      - frontend_node_modules:/app/node_modules
    depends_on:
      - api
    restart: unless-stopped
    logging:
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  pgdata:
  neo4jdata:
  uploads:
  hf_cache:
  frontend_node_modules:
